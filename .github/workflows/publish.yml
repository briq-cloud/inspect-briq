name: publish
# Publishes inspect-briq to PyPI when a release tag (v0.1.0) is pushed. PyPI Trusted Publishing: no
# token, the registry trusts this workflow of this repo (a Trusted Publisher of the project, with no
# environment), and attaches the package's attestations.
on:
  push:
    tags: ["v*"]

permissions: { contents: read, id-token: write }

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The tag is the package's version
        run: |
          set -euo pipefail
          have=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/inspect_briq/_version.py)
          test -n "$have" && test "v$have" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, package $have"; exit 1; }
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Install the wheel in a clean environment and check the entry point
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/inspect_briq-*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -c "import inspect_briq; print(inspect_briq.__version__)"
      - run: uv publish --trusted-publishing always "$RUNNER_TEMP"/dist/*
